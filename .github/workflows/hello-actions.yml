name: Hello GitHub Actions

on:
  push:
    branches:
      - main
      - actions-check
    paths:
      - 'hello.py'
      - 'test_hello.py'
      - 'run_tests.py'
      - '.github/workflows/hello-actions.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show Git version
        run: git --version

      - name: Show repository
        run: 'echo "Repository: $GITHUB_REPOSITORY"'

      - name: Show branch
        run: 'echo "Branch: $GITHUB_REF_NAME"'

      - name: Run Python tests and generate report
        run: python run_tests.py

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results.txt
  report:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Generate report message
        run: echo "Python tests completed successfully!"
